# Run the checks a contributor runs locally on every push to master and on
# pull requests. Deployment is done by Cloudflare Pages, which builds the
# static site from master itself.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Chrome is already on the runner. iPhone WebKit is installed here.
      # The four-browser run took 18 minutes on this runner, more than twice
      # the previous job, and its Firefox build has no usable WebGL. CI keeps
      # the full Chrome suite plus the WebKit cases that cover loading,
      # saving, the phone toolbar, and the 3D view. Firefox stays a local run
      # (`npm run test:ui:firefox`); `npx playwright test` still runs all four.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:ui
      - run: npm run test:ui:webkit
      # A one-off UI failure is otherwise gone with the runner: keep the
      # screenshots and page snapshots Playwright wrote for it.
      - name: Keep the UI test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
