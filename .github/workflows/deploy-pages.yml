# Publish the app to GitHub Pages on every push to master, after the same
# checks a contributor runs locally. Projects are saved in each visitor's
# browser, so the site is static and needs no backend.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # ubuntu-latest ships Google Chrome, which playwright.config.mjs uses.
      - run: npm run test:ui
      - id: pages
        uses: actions/configure-pages@v5
      # The site is served from /<repo>/, so assets and GLBs need that base.
      - run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
